<!-- Show layout only if not on the login / password reset pages -->
<div *ngIf="showLayout">
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="logo">
        <a routerLink="/"><img src="assets/logo_progress_white1.png" alt="Company Logo" /></a>
      </div>
      <!-- Menu button: only useful when the admin sidebar exists -->
      <button class="hamburger-btn" *ngIf="isAdmin" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
        <fa-icon [icon]="faBars"></fa-icon>
      </button>
    </div>

    <!-- Logged-in administrator -->
    <div class="user-info" *ngIf="isAdmin" (click)="toggleDropdown()" #dropdown>
      <span>{{ username }}</span>
      <mat-icon>account_circle</mat-icon>
      <mat-icon>arrow_drop_down</mat-icon>

      <!-- Dropdown menu -->
      <div class="dropdown-menu" *ngIf="dropdownOpen">
        <mat-icon>logout</mat-icon>
        <button (click)="logout()">Logout</button>
      </div>
    </div>

    <!-- Public visitor -->
    <a *ngIf="!isAdmin" routerLink="/login" class="admin-link">
      <mat-icon>admin_panel_settings</mat-icon>
      Administration
    </a>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Sidebar: administrators only -->
    <aside class="sidebar" *ngIf="isAdmin" [class.collapsed]="isSidebarCollapsed">
      <nav>
        <a routerLink="/dashboard/api-tokens">
          <mat-icon>vpn_key</mat-icon>
          API Tokens
        </a>
        <a routerLink="/dashboard/statistics">
          <mat-icon>bar_chart</mat-icon>
          Statistics
        </a>
        <a [href]="apiDocsUrl" target="_blank" rel="noopener">
          <mat-icon>menu_book</mat-icon>
          API documentation
        </a>
        <a routerLink="/">
          <mat-icon>upload</mat-icon>
          Public upload page
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" [class.no-sidebar]="!isAdmin">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Login / password reset layout -->
<div *ngIf="!showLayout">
  <router-outlet></router-outlet>
</div>
