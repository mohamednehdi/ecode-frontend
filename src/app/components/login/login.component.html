<body>
    <div  class="main">
        <section class="sign-in">
            <div class="container">
                <div class="signin-content">
                    <div class="signin-image">
                        <figure><img [src]="imagePath" alt="sing up image">
                        </figure>
                        <a routerLink="/" class="signup-image-link">Back to the free upload page</a>
                    </div>
                    <div class="signin-form">
                        <h2 class="form-title">Login</h2>
                        <form class="sign-in-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()"[autocomplete]="false">
                            <div class="form-group">
                                <label for="your_name"><i class="mdi mdi-account"></i></label>
                                <input formControlName="email" type="text" name="username" id="email"
                                    placeholder="Email" />
                            </div>
                            <div class="form-group">
                                <label for="your_pass"><i class="mdi mdi-lock"></i></label>
                                <input formControlName="password" type="password" name="password" id="password"
                                    placeholder="Password" />
                            </div>
                            <div class="form-group">
                                <a routerLink="/request-reset-password" class="forgot-password-link">
                                    Forgot your password?
                                </a>
                            </div>
                            <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
                            <div class="form-group form-button">
                                <input  type="submit" name="signin" id="signin" class="form-submit"
                                    value="Log in" />
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
