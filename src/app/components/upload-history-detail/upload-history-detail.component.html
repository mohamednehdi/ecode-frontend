<div class="page-wrapper" *ngIf="barcode">
  <div class="detail-container">
    <h2>Barcode Details</h2>
    <p><strong>Type:</strong> {{ barcode.type }}</p>
    <p *ngIf="barcode.page"><strong>Page:</strong> {{ barcode.page }}</p>
    <p><strong>Time:</strong> {{ barcode.time | date: 'full' }}</p>
    <p><strong>Extracted Data:</strong></p>
    <pre>{{ barcode.data }}</pre>
    <div class="barcode-image">
      <img *ngIf="barcode.image" [src]="'data:image/jpeg;base64,' + barcode.image" alt="Barcode Image">
    </div>
    <button (click)="goBack()">Back</button>
  </div>
</div>
