<body>
    <div class="main">
        <section class="signup">
            <div class="container">
                <div class="signup-content">
                    <div class="signup-form">
                        <h2 class="form-title">Sign up</h2>
                        <form  class="register-form" id="register-form" [formGroup]="signupForm" (ngSubmit)="onSubmit()"[autocomplete]="false">
                            
                            <div class="form-group">
                                <label for="first_name"><i class="mdi mdi-account"></i></label>
                                <input type="text" name="first_name" id="first_name" placeholder="First Name" formControlName="first_name">
                            </div>

                            <div class="form-group">
                                <label for="last_name"><i class="mdi mdi-account"></i></label>
                                <input type="text" name="last_name" id="last_name" placeholder="Last Name" formControlName="last_name">
                            </div>
                            <div class="form-group">
                                <label for="email"><i class="mdi mdi-email"></i></label>
                                <input type="email" name="email" id="email" placeholder="Your Email" formControlName="email">
                            </div>
                            <div class="form-group">
                                <label for="pass"><i class="mdi mdi-lock"></i></label>
                                <input type="password" name="pass" id="pass" placeholder="Password" formControlName="password">
                            </div>
                            <div class="form-group">
                                <label for="re-pass"><i class="mdi mdi-lock-outline"></i></label>
                                <input type="password" name="re_pass" id="re_pass" placeholder="Repeat your password" formControlName="re_pass">
                            </div>
                            <!--div class="form-group">
                                <input type="checkbox" name="agree-term" id="agree-term" class="agree-term" formControlName="agree_term">
                                <label for="agree-term" class="label-agree-term"><span><span></span></span>
                                    
                                    I agree all statements in <a href="#" class="term-service">Terms of service</a></label>
                            </div-->
                            <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
                            <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>
                            <div class="form-group form-button">
                                <input type="submit" name="signup" id="signup" class="form-submit" value="Register">
                            </div>
                        </form>
                    </div>
                    <div class="signup-image">
                        <figure><img [src]="imagePath" alt="sing up image"></figure>
                        <a routerLink="/login" class="signup-image-link">I am already member</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
