<div class="page-wrapper">
  <div class="history-container" *ngIf="history && history.length > 0; else noHistory">
    <h2>Upload History</h2>
    <table class="history-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Type</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of history; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ item.type }}</td>
          <td>{{ item.time | date: 'short' }}</td>
          <td>
            <button class="view-btn" (click)="viewDetails(item)">View Details</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #noHistory>
  <div class="page-wrapper">
    <div class="no-history">
      <p>No barcode history found.</p>
    </div>
  </div>
</ng-template>
