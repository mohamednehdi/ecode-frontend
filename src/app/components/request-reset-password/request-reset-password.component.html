<body>
  <div class="main">
    <section class="request-reset-password">
      <div class="container">
        <div class="request-reset-content">
          <div class="request-reset-form">
            <h2 class="form-title">Request Password Reset</h2>
            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="request-reset-form">
              <div class="form-group">
                <label for="email"><i class="mdi mdi-email"></i></label>
                <input
                  type="email"
                  id="email"
                  formControlName="email"
                  placeholder="Enter your email"
                />
              </div>
              <div class="form-group form-button">
                <input type="submit" class="form-submit" [disabled]="resetForm.invalid" value="Request Reset" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
