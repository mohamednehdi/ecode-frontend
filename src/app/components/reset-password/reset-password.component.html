<body>
  <div class="main">
    <section class="reset-password">
      <div class="container">
        <div class="reset-password-content">
          <div class="reset-password-form">
            <h2 class="form-title">Reset Password</h2>
            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form">
              <div class="form-group">
                <label for="password"><i class="mdi mdi-lock"></i></label>
                <input
                  type="password"
                  id="password"
                  formControlName="password"
                  placeholder="New Password"
                />
                <div *ngIf="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched" class="text-danger">
                  <small *ngIf="resetPasswordForm.get('password')?.errors?.['required']">Password is required.</small>
                  <small *ngIf="resetPasswordForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters long.</small>
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword"><i class="mdi mdi-lock"></i></label>
                <input
                  type="password"
                  id="confirmPassword"
                  formControlName="confirmPassword"
                  placeholder="Confirm Password"
                />
                <div *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched" class="text-danger">
                  <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Confirmation is required.</small>
                  <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['mustMatch']">Passwords must match.</small>
                </div>
              </div>

              <div class="form-group form-button">
                <input type="submit" class="form-submit" [disabled]="resetPasswordForm.invalid" value="Reset Password" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
