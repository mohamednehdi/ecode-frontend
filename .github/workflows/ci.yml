name: CI

# Every push and pull request: build, unit tests with coverage, and the end-to-end test (a real browser on the real site and backend).
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests with coverage (headless Chrome)
        run: npm run test:ci
      - name: Coverage in the run summary
        if: always()
        run: |
          echo "### Unit-test coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/barcode/lcov.info ]; then
            awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{printf "%.1f %% of the lines (%d of %d)\n", 100*h/f, h, f}' coverage/barcode/lcov.info >> "$GITHUB_STEP_SUMMARY"
          else
            echo "not available" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/barcode

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: sqlite:////tmp/e2e.db
      FRONTEND_ORIGIN: http://localhost:4200
      ADMIN_EMAIL: e2e-admin@example.test
      ADMIN_PASSWORD: E2e-Password-123
    steps:
      - uses: actions/checkout@v4
      # The backend lives in another repository. If that repository is private, create a secret BACKEND_REPO_TOKEN
      # (a token that can read it); otherwise the default token is enough.
      - uses: actions/checkout@v4
        with:
          repository: mohamednehdi/ecode-backend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64
          pip install -r backend/requirements.txt
      - name: Prepare the test database and the administrator
        working-directory: backend
        run: |
          flask --app run init-db
          flask --app run create-admin --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD"
      - name: Start the backend
        working-directory: backend
        run: nohup python run.py > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start the site
        run: nohup npx ng serve --port 4200 > site.log 2>&1 &
      - name: Wait for both servers
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:5000/health > /dev/null && curl -fsS http://localhost:4200 > /dev/null; then echo "both up"; exit 0; fi
            sleep 2
          done
          echo "--- backend.log"; cat backend.log
          echo "--- site.log"; tail -50 site.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            backend.log
            site.log
